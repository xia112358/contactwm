name: Portable setup

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-checkout:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test tools
        run: python -m pip install pytest numpy uv==0.13.1
      - name: Check tracked source assets and portable defaults
        run: |
          python scripts/check_workflow.py --source-only
          python scripts/setup_workflow_environment.py --dry-run
          test ! -e runtime/current
          test ! -e configs/workflow_resources.local.json
      - name: Test launcher, configuration precedence and installation safety
        run: |
          mkdir -p tmp
          python -m pytest -q --confcutdir=tests -p no:cacheprovider \
            --basetemp=tmp/portable-tests -o tmp_path_retention_policy=all \
            tests/test_workflow_launcher.py tests/test_workflow_setup.py tests/test_bootstrap_runtime.py tests/test_original12_portability.py tests/test_original12_training_contract.py
