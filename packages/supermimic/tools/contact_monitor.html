<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAgger · 实时训练</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10151d;color:#e7edf5}body{max-width:1060px;margin:36px auto;padding:0 22px}h1{font-size:28px;margin:0}header{display:flex;justify-content:space-between;gap:20px;align-items:center}p{color:#a4b4c9;line-height:1.7}.badge{padding:12px 18px;background:#234c41;border-radius:24px;font-weight:700}.error{background:#6b343a}.done{background:#244875}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card,section{background:#192230;border:1px solid #2c3a4c;border-radius:16px;padding:20px}.card span{display:block;color:#a4b4c9;font-size:14px}.card strong{font-size:30px;display:block;margin-top:8px}svg{width:100%;height:auto}button{background:#29486c;color:white;padding:10px 16px;border:0;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:right;border-bottom:1px solid #2c3a4c;padding:10px}th:first-child,td:first-child{text-align:left}#notice{color:#90dfbc}#connection{font-size:13px}section{margin-bottom:18px}h2{font-size:18px;margin-top:0}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}header{align-items:start;flex-direction:column}}
</style>
<header><div><h1>DAgger 初始化 · 实时监测</h1><p>19 个接触小段 · 仅动作 MSE 决定平台期</p></div><div id="state" class="badge">正在连接…</div></header>
<div class="cards"><div class="card"><span>最新动作 MSE</span><strong id="mse">—</strong></div><div class="card"><span>轮次 / 上限</span><strong id="round">—</strong></div><div class="card"><span>梯度更新次数</span><strong id="updates">—</strong></div><div class="card"><span>连续无明显改善</span><strong id="plateau">—</strong></div></div>
<section><h2>动作 MSE 变化</h2><svg id="chart" viewBox="0 0 960 300" role="img" aria-label="各轮动作 MSE 曲线"></svg><p id="change"></p></section>
<section><h2>训练状态</h2><p id="details">读取中…</p><p id="notice" aria-live="polite"></p><button id="notify">启用结束时的浏览器通知</button><p id="connection">每 3 秒自动刷新，不需要手动刷新页面。</p></section>
<section><h2>最近各轮</h2><table><thead><tr><th>轮次</th><th>更新次数</th><th>动作 MSE</th><th>较前轮</th></tr></thead><tbody id="history"></tbody></table></section>
<p>曲线包含续训前的历史。MSE 是每段学生实际访问状态上的动作误差，再对小段等权平均；各轮状态分布会变化。Root 和接触结果不参与停止判据。页面关闭后训练继续，浏览器通知需保持页面打开。</p>
<script>
const $=id=>document.getElementById(id);let previousKind=null,notified=false;
$('notify').onclick=async()=>{if(!('Notification'in window)){alert('当前浏览器不支持通知，请查看页面状态。');return}const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'结束通知已启用':'未开启通知，页面仍会显示结束状态';};
function chart(rows){if(!rows.length)return;const w=960,h=300,l=60,r=20,t=20,b=35,maxY=Math.max(...rows.map(x=>x.mse))*1.08,maxX=Math.max(1,...rows.map(x=>x.round));const x=v=>l+v/maxX*(w-l-r),y=v=>h-b-v/maxY*(h-t-b);let s='';for(let i=0;i<5;i++){let v=maxY*i/4;s+=`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}" stroke="#304155"/><text x="${l-10}" y="${y(v)+4}" fill="#9bacc2" text-anchor="end" font-size="12">${v.toFixed(2)}</text>`}s+=`<polyline points="${rows.map(a=>`${x(a.round)},${y(a.mse)}`).join(' ')}" fill="none" stroke="#75dcb2" stroke-width="3"/>`;for(const a of rows)s+=`<circle cx="${x(a.round)}" cy="${y(a.mse)}" r="3" fill="#75dcb2"><title>第 ${a.round} 轮：MSE ${a.mse.toFixed(5)}</title></circle>`;s+=`<text x="${l}" y="295" fill="#9bacc2" font-size="12">第 0 轮</text><text x="${w-r}" y="295" text-anchor="end" fill="#9bacc2" font-size="12">第 ${maxX} 轮</text>`;$('chart').innerHTML=s;}
async function refresh(){try{const response=await fetch('status.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const d=await response.json(),a=d.latest,rows=d.curve;$('state').textContent=d.label;$('state').className='badge '+d.kind;document.title=d.label+' · DAgger';$('mse').textContent=a?a.mse.toFixed(4):'—';$('round').textContent=a?`${a.round} / ${d.max_rounds}`:'—';$('updates').textContent=a?a.updates:'—';$('plateau').textContent=`${d.plateau_count} / ${d.plateau_patience}`;chart(rows);$('change').textContent=rows.length>1?`初始 ${rows[0].mse.toFixed(4)} → 当前 ${a.mse.toFixed(4)}，下降 ${((1-a.mse/rows[0].mse)*100).toFixed(1)}%。`:'';const reason={plateau:'MSE 达到平台期',max_rounds:'达到轮数上限',interrupted:'训练被中断'};let details=`连续 ${d.plateau_patience} 轮未取得明显 MSE 改善就停止；改善阈值为 ${d.min_improvement} 与 ${(d.relative_improvement*100).toFixed(0)}% 中的较大值。`;if(d.summary)details=`${reason[d.summary.stop_reason]||d.summary.stop_reason}；已选择第 ${d.summary.best_round} 轮权重（${d.summary.best_updates} 次更新）。`;$('details').textContent=d.error||details;const terminal=d.kind==='done'||d.kind==='error';$('notice').textContent=terminal?'本次训练已停止，不需要继续等待。':d.kind==='evaluating'?'DAgger 已停止更新，正在保存和执行最终回放。':'';const age=(Date.now()/1000-d.updated_at);$('connection').textContent=`最近读取：${new Date().toLocaleTimeString()} · 训练记录更新：${d.training_updated_at?new Date(d.training_updated_at*1000).toLocaleTimeString():'—'} · 每 3 秒刷新`+(age>15&&d.alive?' · 监测数据暂未更新，请勿据此判断训练仍在运行。':'');$('history').innerHTML=rows.slice(-8).reverse().map(v=>{const i=rows.indexOf(v),delta=i?v.mse-rows[i-1].mse:null;return `<tr><td>${v.round}</td><td>${v.updates}</td><td>${v.mse.toFixed(5)}</td><td>${delta===null?'—':(delta>0?'+':'')+delta.toFixed(5)}</td></tr>`}).join('');if(terminal&&!notified){if('Notification'in window&&Notification.permission==='granted')new Notification('DAgger '+d.label,{body:details});notified=true;}previousKind=d.kind;}catch(e){$('connection').textContent='监测连接失败：'+e.message+'；3 秒后重试。';$('state').textContent='连接中断';$('state').className='badge error';}setTimeout(refresh,3000)}refresh();
</script></html>
