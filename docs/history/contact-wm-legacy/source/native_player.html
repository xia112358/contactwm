<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原生执行轨迹</title><style>body{margin:0;background:#101925;color:#dce7f4;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{background:#23364b;color:#e5edf7;border:1px solid #48617b;padding:6px;border-radius:5px}canvas{width:100%;height:450px;display:block;background:#142030}#info{padding:12px;line-height:1.7}input{flex:1;min-width:100px}.muted{color:#91a5bd}</style>
<header><b>真实仿真执行 · Newton/MJWarp</b><span id="summary">等待首段真实执行</span><select id="version"><option value="native.json">最新真实执行</option><option value="native-baseline.json">训练前真实执行</option></select><select id="episode"></select><button id="play">暂停</button><input type="range" min="0" max="39" value="0" id="frame"><span id="clock"></span></header><canvas id="scene"></canvas><div id="info"></div><div class="muted" style="padding:0 12px">拖动旋转，滚轮缩放。蓝色十字：目标；橙色：实际接触点与末端轨迹。每段固定策略、无探索噪声，评估数据不用于训练。接触来自原生求解器；机器人姿态来自积分后的真实状态。</div>
<script>
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');let data,robot,env=4,frame=0,playing=true,yaw=-.65,elev=.5,zoom=1,last=0;const colors=['#7ad0ff','#7ad0ff','#ffad63','#ffad63','#c1a3ff','#c1a3ff'];
const links=['左脚','右脚','左手','右手','左膝','右膝'];
function project(v){const root=data.episodes[env].frames[0].root,x=v[0]-root[0],y=v[1]-root[1],z=v[2]-.5,c=Math.cos(yaw),s=Math.sin(yaw),scale=180*zoom;return [canvas.width/2+(c*x-s*y)*scale,canvas.height*.6-((z)*Math.cos(elev)-(s*x+c*y)*Math.sin(elev))*scale]}
function line(a,b,color,width=1){ctx.beginPath();ctx.moveTo(...project(a));ctx.lineTo(...project(b));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function render(){canvas.width=canvas.clientWidth;canvas.height=450;ctx.clearRect(0,0,canvas.width,canvas.height);if(!data||!robot)return;const ep=data.episodes[env],f=ep.frames[frame],terrain=data.terrain,root=ep.frames[0].root;let triangles=[];
const add=(vertices,faces,color)=>{const pts=vertices.map(project);for(const indices of faces){let center=[0,0,0];for(const i of indices)for(let j=0;j<3;j++)center[j]+=vertices[i][j]/indices.length;triangles.push({p:indices.map(i=>pts[i]),depth:(Math.sin(yaw)*center[0]+Math.cos(yaw)*center[1])*Math.cos(elev)+center[2]*Math.sin(elev),color})}};
const h=terrain.height,r=terrain.resolution,m=terrain.minimum;for(let y=0;y<h.length-1;y++)for(let x=0;x<h[0].length-1;x++){if(![h[y][x],h[y][x+1],h[y+1][x+1],h[y+1][x]].every(Number.isFinite))continue;const wx=m[0]+x*r,wy=m[1]+y*r;if(Math.abs(wx-root[0])>2||Math.abs(wy-root[1])>2)continue;add([[wx,wy,h[y][x]],[wx+r,wy,h[y][x+1]],[wx+r,wy+r,h[y+1][x+1]],[wx,wy+r,h[y+1][x]]],[[0,1,2],[0,2,3]],'#354856')}
for(const part of robot.parts){const t=f.bodyPosition[part.link],R=f.bodyRotation[part.link];add(part.vertices.map(v=>R.map((row,i)=>row.reduce((a,b,j)=>a+b*v[j],t[i]))),part.faces,`rgb(${part.color.map(v=>Math.min(255,v+20)).join(',')})`)}triangles.sort((a,b)=>a.depth-b.depth);for(const t of triangles){ctx.beginPath();t.p.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.closePath();ctx.fillStyle=t.color;ctx.fill();}
const target=ep.target;for(let k=0;k<3;k++){let a=target.slice(),b=target.slice();a[k]-=.06;b[k]+=.06;line(a,b,'#69b9ff',3)}
const wrist=robot.links.indexOf('left_wrist_yaw_link');for(let i=1;i<=frame;i++)line(ep.frames[i-1].bodyPosition[wrist],ep.frames[i].bodyPosition[wrist],'#ffb46a',2);
for(let k=0;k<6;k++)if(f.active[k]){ctx.beginPath();ctx.arc(...project(f.point[k]),5,0,7);ctx.fillStyle=colors[k];ctx.fill()}
$('frame').value=frame;$('clock').textContent=(frame*data.dt).toFixed(2)+' s';const failures=Object.entries(ep.result.checks).filter(([k,v])=>!v).map(([k])=>({known:'接触未知',activation:'接触未持续',force:'承重不足',position:'未到目标位置',slip:'滑动超限',finite:'非有限值',no_failure:'跌倒/提前终止',nonempty:'目标为空'}[k]||k));$('info').textContent=`策略迭代 ${data.iteration} · 本目标 ${ep.result.success?'通过':'未通过：'+failures.join('、')} · 最大落点误差 ${ep.result.max_position_error===null?'无实际接触':(ep.result.max_position_error*100).toFixed(1)+' cm'} · 最大滑动速度 ${ep.result.max_slip.toFixed(3)} m/s\n`+links.map((name,k)=>`${name} ${f.active[k]?'接触':'离开'} ${f.force[k][2].toFixed(1)} N`).join(' | ')+(f.failed?' | 已发生执行失败':'');}
$('version').onchange=()=>refresh();$('episode').onchange=e=>{env=+e.target.value;frame=0;render()};$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放'};$('frame').oninput=e=>{frame=+e.target.value;playing=false;$('play').textContent='播放';render()};let drag;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;elev=Math.max(.1,Math.min(1.4,elev+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];render()}};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.4,Math.min(4,zoom*Math.exp(-e.deltaY*.001)));render()};
async function refresh(){try{const r=await fetch($('version').value+'?t='+Date.now(),{cache:'no-store'});if(!r.ok){data=null;$('summary').textContent='等待本次训练的真实执行';$('info').textContent='';render();return;}data=await r.json();if(data.monitor_version!=='solver_points_v2'){data=null;$('summary').textContent='旧版接触点统计已作废，等待新版真实执行';$('info').textContent='';return;}$('summary').textContent=`迭代 ${data.iteration}：${data.successes}/${data.total} 稳定目标接触通过 · ${data.matched_initial_state===undefined?'初态匹配待核验':data.matched_initial_state?'初态匹配':'初态有差异，暂不认定因果响应增益'}`;$('episode').innerHTML=data.episodes.map(e=>`<option value="${e.index}">目标 ${e.index+1}${e.index===4?'（中心）':''} · ${e.result.success?'通过':'失败'}</option>`).join('');$('episode').value=env;render()}catch(e){$('summary').textContent=String(e)}}fetch('../robot.json').then(r=>r.json()).then(r=>{robot=r;render()});refresh();setInterval(refresh,5000);function tick(t){if(playing&&data&&t-last>80){frame=(frame+1)%40;last=t;render()}requestAnimationFrame(tick)}requestAnimationFrame(tick);window.onresize=render;
</script></html>
